app = "date-night-planner"
primary_region = "nrt" # Tokyo

[build]

[env]
  DATA_DIR = "/data"
  TZ = "Asia/Tokyo"
  PORT = "8080"

# SQLite, the WhatsApp session and browser logins live here.
[mounts]
  source = "planner_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Must stay up: WhatsApp connection, timers and the Gmail watcher.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
